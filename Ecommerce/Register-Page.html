<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThinkMart - Register</title>
    <link rel="stylesheet" href="styles/index.css">
</head>

<body class="login-body">

    <button class="theme-toggle" type="button" aria-label="Toggle dark mode">☾</button>

        <div class="login-box register-box">

            <h1>Think<span>Mart</span></h1>
            <p class="subtitle">Create Your Account</p>

            <h2>Register</h2>

            <form>

                <label>Full Name</label>
                <input type="text" placeholder="Enter your name" required>

                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>

                <label>Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required>

                <label>Password</label>
                <input type="password" placeholder="Create a password" required>

                <label>Confirm Password</label>
                <input type="password" placeholder="Confirm password" required>

                <button type="submit" class="main-btn">
                    Create Account
                </button>

            </form>

            <p class="account-text">
                Already have an account?
                <a href="index.html">Login</a>
            </p>

        </div>

    </div>

    <script>
        const toggle = document.querySelector('.theme-toggle');
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');
        const initialDark = savedTheme ? savedTheme === 'dark' : false;

        body.classList.toggle('dark-mode', initialDark);
        if (toggle) {
            toggle.textContent = initialDark ? '☀' : '☾';
            toggle.addEventListener('click', () => {
                const isDark = body.classList.toggle('dark-mode');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                toggle.textContent = isDark ? '☀' : '☾';
            });
        }
    </script>

</body>
</html>
